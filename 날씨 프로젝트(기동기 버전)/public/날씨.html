```html
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>날씨 기동기버전</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    >

    <style>
        body {
            background-color: #1a2c3d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Arial, sans-serif;
        }

        .hero-card {
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #1e293b 100%
            );
            color: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(15, 25, 42, 0.15);
        }

        .badge-provider {
            background-color: #10b981;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 9999px;
        }

        .buzzer-box {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            background: white;
            transition: all 0.3s ease;
        }

        .buzzer-box.pending {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .buzzer-box.fulfilled {
            border-color: #10b981;
            background: #ecfdf5;
        }

        .buzzer-box.rejected {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .terminal-window {
            background: #090d16;
            border-radius: 10px;
            padding: 16px;
            color: #38bdf8;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            height: 230px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>


<body class="py-5">

    <div class="container" style="max-width: 850px;">

        <!-- =========================
             날씨 요청 제어판
        ========================== -->

        <div class="card shadow-sm border-0 mb-4 p-4">

            <h5 class="fw-bold mb-3">
                1. 날씨 요정 제어판
            </h5>


            <div class="row g-3 align-items-end">

                <!-- 도시 선택 -->
                <div class="col-md-5">

                    <label
                        class="form-label small text-muted"
                        for="citySelect"
                    >
                        도시 선택
                    </label>

                    <select
                        id="citySelect"
                        class="form-select"
                    >

                        <option value="seoul">
                            서울
                        </option>

                        <option value="busan">
                            부산
                        </option>

                        <option value="incheon">
                            인천
                        </option>

                        <option value="daegu">
                            대구
                        </option>

                        <option value="daejeon">
                            대전
                        </option>

                        <option value="gwangju">
                            광주
                        </option>

                    </select>

                </div>


                <!-- 버튼 -->
                <div class="col-md-7 d-flex gap-2">

                    <button
                        id="btnFetchSingle"
                        class="btn btn-primary flex-fill py-2 fw-semibold"
                    >
                        단일 조회 (async / await)
                    </button>


                    <button
                        id="btnFetchAll"
                        class="btn btn-success flex-fill py-2 fw-semibold"
                    >
                        6개 도시 병렬 조회 (Promise.all)
                    </button>

                </div>

            </div>

        </div>


        <!-- =========================
             진동벨 상태 카드
        ========================== -->

        <div
            id="buzzerCard"
            class="buzzer-box mb-4"
        >

            <!-- 진동벨 제목 -->

            <div
                class="d-flex justify-content-between align-items-center mb-1"
            >

                <h6
                    class="fw-bold mb-0"
                    id="buzzerTitle"
                >
                    🔔 진동벨 (Promise) 상태:
                    대기 준비 완료
                </h6>


                <span
                    class="badge bg-secondary"
                    id="buzzerBadge"
                >
                    IDLE
                </span>

            </div>


            <!-- 진동벨 설명 -->

            <p
                class="mb-0 text-muted small"
                id="buzzerDesc"
            >
                버튼을 클릭하면 진동벨(Promise)을 받고
                날씨 조회를 시작합니다.
            </p>


            <!-- =========================
                 날씨 결과
            ========================== -->

            <div
                id="weatherResult"
                class="mt-3 pt-3 border-top d-none"
            >

                <div
                    class="row text-center g-2"
                    id="resultGrid"
                ></div>

            </div>

        </div>


        <!-- =========================
             터미널 콘솔
        ========================== -->

        <div class="card shadow-sm border-0 p-4">

            <div
                class="d-flex justify-content-between align-items-center mb-2"
            >

                <h6 class="fw-bold mb-0">
                    📜 비동기 처리 실시간 콘솔
                    (Console Log)
                </h6>


                <button
                    class="btn btn-sm btn-outline-secondary"
                    onclick="clearLog()"
                >
                    로그 지우기
                </button>

            </div>


            <div
                class="terminal-window"
                id="terminalLog"
            >
                &gt; 시스템 준비 완료.
                상단 버튼을 클릭해 보세요.
            </div>

        </div>

    </div>


    <!-- =========================
         JavaScript
    ========================== -->

    <script src="날씨.js"></script>

</body>

</html>
