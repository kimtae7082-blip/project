<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>OpenAPI 카드 예제</title>
  <style>
    #cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    article { border:1px solid #ddd; padding:12px; border-radius:8px; }
  </style>
</head>
<body>
  <h1>외부 API 데이터 카드 출력</h1>
  <button id="loadBtn">게시물 불러오기</button>
  <p id="status"></p>
  <section id="cards"></section>
  <script >
const status = document.querySelector("#status");
const cards = document.querySelector("#cards");

document.querySelector("#loadBtn").addEventListener("click", async () => {
  status.textContent = "불러오는 중...";
  cards.innerHTML = "";

  try {
    const response = await fetch(
      "https://jsonplaceholder.typicode.com/posts?_limit=6"
    );

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const posts = await response.json();

    cards.innerHTML = posts.map(post => `
      <article>
        <h3>${post.title}</h3>
        <p>${post.body}</p>
      </article>
    `).join("");

    status.textContent = `${posts.length}건을 불러왔습니다.`;
  } catch (error) {
    status.textContent = `오류: ${error.message}`;
  }
});




  </script>
</body>
</html>
